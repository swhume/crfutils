[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crfutils"
version = "0.1.0"
description = "CDISC ODM v2.0 CRF utilities"
readme = "README.md"
authors = [{ name = "Sam Hume", email = "swhume@gmail.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["ODM", "ODM-XML", "CRF", "annotated CRF", "CDISC"]
dependencies = [
    "lxml >= 6.0.1",
    # crfrefs and crfmetrics need the ODM v2.0 fixes that follow odmlib 0.2.1 (an empty TranslatedText,
    # TimepointTarget, xsi:* attributes, interleaved ItemRef/ItemGroupRef order, the UnitsItemOID and
    # Leaf mappings). Until they are released, install odmlib from its repository:
    #     pip install -e /path/to/odmlib
    # and raise this pin to that release's version when it ships. tests/test_model.py fails on an
    # odmlib without the fixes
    "odmlib >= 0.2.1",
    "xmlschema >= 4.1.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
# crfpdf only; WeasyPrint also needs the Pango system libraries (see README.md)
pdf = ["weasyprint >= 68, < 69", "pypdf >= 5.9, < 6"]
test = ["pytest", "pytest-cov", "pypdf >= 5.9, < 6"]

[project.urls]
Homepage = "https://github.com/swhume/crfutils"

[project.scripts]
# each command calls run(), not main(): run() holds the Ctrl-C / broken-pipe handling
crfvalidate = "crfutils.validate.__main__:run"
crfhtml = "crfutils.crfhtml.__main__:run"
crfpp = "crfutils.crfpp.__main__:run"
crfrefs = "crfutils.crfrefs.__main__:run"
crfmetrics = "crfutils.metrics.__main__:run"
crfpdf = "crfutils.crfpdf.__main__:run"

[project.gui-scripts]
# a GUI script: on Windows pip installs it with a windowed launcher, so opening a CRF with it opens no console
# window. It calls run() too
crfreview = "crfutils.crfreview.__main__:run"

[tool.setuptools]
packages = ["crfutils", "crfutils.validate", "crfutils.crfhtml", "crfutils.crfpp", "crfutils.crfrefs",
            "crfutils.metrics", "crfutils.crfreview", "crfutils.crfpdf"]

[tool.setuptools.package-data]
# Include non-Python files needed at runtime (schemas, XSL, print CSS, fonts). A later frozen build collects its
# data files from the installed package, so a file missing here is missing from the executables too
"crfutils.validate" = ["schema/odm-2-0/*.xsd", "schema/odm-2-0/*.html"]
"crfutils.crfhtml" = ["odm_2-0_crf.xsl", "odm_2-0_crf.xsl.LICENSE"]
"crfutils.crfpdf" = ["acrf.css", "fonts/*.ttf", "fonts/LICENSE"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "tests"]
